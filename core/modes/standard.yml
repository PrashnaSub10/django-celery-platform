# ============================================================
# Standard Mode overrides
# ============================================================
# Philosophy: "You can now see problems before users report them"
# Purpose: Stability + visibility.
# Adds: Prometheus, Grafana, exporters.
# Excludes: Kafka, Alertmanager.
#
# NOTE: RabbitMQ / worker-critical are intentionally left at their
# default scale (1) here. BROKER_MODE=hybrid and WORKER_MODE=dual
# (validated above) require both brokers to run, and up.sh's own
# guidance says "Use MODE=standard or MODE=full for RabbitMQ or
# hybrid broker strategies" — disabling them here would silently
# break that combination.
# ============================================================

services:
  # Turn off Kafka infrastructure
  kafka:
    scale: 0

  # Turn off Advanced Alerting
  alertmanager:
    scale: 0
