# Keep base images and action pins fresh — unpinned-but-tagged images
# (python:3.13-slim) drift between builds; weekly PRs surface that drift
# as reviewable diffs instead of silent behavior changes.
version: 2
updates:
  - package-ecosystem: docker
    directory: /components/workers
    schedule:
      interval: weekly
    ignore:
      # Python major/minor bumps are a deliberate, tested migration — the
      # requirements pins (PyMuPDF/Pillow cp313 wheels) are version-coupled.
      # Patch updates (3.13.x) are welcome.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
