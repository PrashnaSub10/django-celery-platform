# ============================================================
# smoke.yml — Boot the minimal stack and run component smoke tests
# ============================================================
# Validates that a stranger on a fresh machine can go from clone
# to a running stack — the exact path setup.sh + up.sh promise.
# ============================================================

name: Smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build base worker image
        run: docker build -t celery-microservice:base -f components/workers/Dockerfile.base components/workers/

      - name: First-run setup (secrets + TLS certs + profile)
        run: |
          chmod +x setup.sh init-secrets.sh components/gateway/scripts/generate_mtls_certs.sh
          ./setup.sh
          # Point the profile at a real directory + the platform's own
          # reference config so CODE_SOURCE=bind validation passes.
          sed -i "s|^APP_PATH=.*|APP_PATH=$(pwd)/components/workers|" celery-profile.env || \
            echo "APP_PATH=$(pwd)/components/workers" >> celery-profile.env
          grep -q '^WORKER_IMAGE=' celery-profile.env && \
            sed -i 's|^WORKER_IMAGE=.*|WORKER_IMAGE=celery-microservice:base|' celery-profile.env || \
            echo "WORKER_IMAGE=celery-microservice:base" >> celery-profile.env

      - name: Start minimal stack
        run: |
          chmod +x core/up.sh
          MODE=minimal BROKER_MODE=redis SERVER_PROFILE=small \
            PROJECT_PROFILE=celery-profile.env ./core/up.sh up

      # NOTE: components/*/tests/smoke_test.sh are NOT run here. They are
      # standalone tests — each boots its own isolated stack and tears down
      # the shared celery-* containers on exit, which collides with the live
      # stack this job just started. They run in their own workflows
      # (test-brokers / test-gateway / test-workers / test-observability).
      # This job validates the INTEGRATED stack instead.
      - name: Validate booted stack
        run: |
          sleep 25
          docker ps --format '{{.Names}}\t{{.Status}}'

          echo "::group::hard gates"
          # Redis broker must be healthy
          test "$(docker inspect -f '{{.State.Health.Status}}' celery-redis-shared)" = "healthy"
          # Gateway must terminate TLS and serve /health
          curl -ksf --max-time 10 https://127.0.0.1:8443/health | grep -q healthy
          echo "::endgroup::"

          echo "::group::soft checks (reported, non-blocking)"
          docker logs --tail 15 "$(docker ps -aq --filter name=worker-fast | head -1)" || true
          (echo > /dev/tcp/127.0.0.1/5555) 2>/dev/null \
            && echo "flower :5555 answering" \
            || echo "flower :5555 not answering (non-blocking)"
          echo "::endgroup::"

      - name: Show container state on failure
        if: failure()
        run: |
          docker ps -a
          for c in $(docker ps -aq); do
            echo "==== $(docker inspect -f '{{.Name}}' "$c") ===="
            docker logs --tail 30 "$c" 2>&1 || true
          done

      - name: Tear down
        if: always()
        run: PROJECT_PROFILE=celery-profile.env ./core/up.sh down || true
